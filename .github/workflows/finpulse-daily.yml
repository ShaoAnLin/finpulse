name: FinPulse Daily

on:
  schedule:
    # 07:23 Asia/Taipei (UTC+8)
    - cron: "23 23 * * *"
  workflow_dispatch:

jobs:
  run-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore FinPulse state
        uses: actions/cache@v4
        with:
          path: state.sqlite3
          key: finpulse-state-${{ github.run_id }}
          restore-keys: |
            finpulse-state-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run daily digest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FINPULSE_AI_MODEL: ${{ vars.FINPULSE_AI_MODEL || 'llama-3.3-70b-versatile' }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          FINPULSE_LINE_TARGET: ${{ secrets.FINPULSE_LINE_TARGET }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: bash run_daily.sh